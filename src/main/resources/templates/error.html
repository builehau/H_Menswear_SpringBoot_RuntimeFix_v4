<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi | H-Menswear</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0} body{font-family:'Montserrat',sans-serif;background:#f7f7f7;color:#222;min-height:100vh;display:grid;place-items:center;padding:24px}
        .box{width:min(620px,100%);background:#fff;border-radius:16px;padding:42px;box-shadow:0 15px 45px rgba(0,0,0,.08);text-align:center;border-top:5px solid #b08d57}
        .icon{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;background:#fff5e7;color:#b08d57;display:grid;place-items:center;font-size:30px}.code{font-size:48px;font-weight:700;color:#111}.title{margin-top:6px;font-size:18px;font-weight:600}.message{margin:18px auto 28px;color:#666;line-height:1.65;max-width:480px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:600;transition:.2s}.primary{background:#111;color:#fff}.secondary{border:1px solid #ddd;color:#333;background:#fff}.btn:hover{transform:translateY(-1px);filter:brightness(.96)}
    </style>
</head>
<body>
<div class="box">
    <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="code" th:text="${statusCode}">500</div>
    <div class="title" th:text="${statusText}">Lỗi hệ thống</div>
    <p class="message" th:text="${errorMessage}">Đã xảy ra lỗi khi xử lý yêu cầu.</p>
    <div class="actions">
        <a class="btn primary" href="/home"><i class="fa-solid fa-house"></i> Trang chủ</a>
        <a class="btn secondary" href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
    </div>
</div>
</body>
</html>
